<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Compass "Bearing" mark, light-background variant: darker ring so it
       reads on white (README, light theme). Dark-background variant lives
       in compass.svg (light ring). Geometry is identical to compass.svg. -->
  <defs>
    <mask id="gap">
      <rect width="100" height="100" fill="white"/>
      <circle cx="73.3" cy="26.7" r="19.5" fill="black"/>
    </mask>
  </defs>
  <circle cx="50" cy="50" r="29" fill="none" stroke="#454C5A" stroke-width="8" mask="url(#gap)"/>
  <circle cx="73.3" cy="26.7" r="13" fill="#A46FD1"/>
</svg>
